<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ICARO × BonePrint Lab · Guides PSI rachis en réalité augmentée</title>
<script type="module" src="model-viewer.min.js"></script>
<style>
  :root{--bleu:#00b2ff;--rouge:#ff3c28;--or:#f2c14e;--fond:#0a121b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;touch-action:none;overscroll-behavior:none;background:radial-gradient(ellipse at 50% 45%,#1d3044 0%,#0f1c29 45%,var(--fond) 100%);color:#e8eef3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  header{pointer-events:none;position:fixed;top:0;left:0;right:0;padding:12px 14px 18px;z-index:2;background:linear-gradient(#0a121bf0,#0a121b00)}
  .marques{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-weight:800;letter-spacing:.08em;font-size:.82rem;padding:5px 10px;border-radius:7px}
  .icaro{background:linear-gradient(135deg,#00b2ff,#0066cc);color:#fff}
  .bpl{border:1.5px solid var(--or);color:var(--or)}
  .bpl b{color:#fff;font-weight:800}
  .x{opacity:.5;font-size:.8rem}
  header h1{font-size:.98rem;font-weight:650;margin-top:9px}
  header p{font-size:.72rem;opacity:.6;margin-top:2px}
  model-viewer{width:100%;height:100%;--poster-color:transparent;--progress-bar-color:var(--bleu)}
  .aide{pointer-events:none;position:fixed;top:108px;left:50%;transform:translateX(-50%);font-size:.74rem;background:#ffffff17;padding:6px 12px;border-radius:999px;z-index:2;white-space:nowrap;transition:opacity .6s}
  .bas{position:fixed;left:0;right:0;bottom:0;padding:10px 12px 20px;z-index:2;background:linear-gradient(#0a121b00,#0a121bf5 35%)}
  .toggles{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
  .t{font:inherit;font-size:.78rem;font-weight:650;border-radius:999px;padding:9px 12px;cursor:pointer;background:#ffffff12;color:#fff;border:1.5px solid #ffffff40;display:flex;align-items:center;gap:6px}
  .t i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .t.on{background:#ffffff22}
  .t.off{opacity:.45}
  #ar{display:block;width:100%;max-width:420px;margin:0 auto;font:inherit;font-size:.95rem;font-weight:700;border:none;border-radius:14px;padding:13px;background:linear-gradient(135deg,#00b2ff,#0066cc);color:#fff;box-shadow:0 6px 22px #00b2ff55;cursor:pointer}
  .credit{text-align:center;font-size:.66rem;opacity:.45;margin-top:9px}
</style>
</head>
<body>
<header>
  <div class="marques"><span class="badge icaro">ICARO</span><span class="x">×</span><span class="badge bpl"><b>BONE</b>PRINT LAB</span></div>
  <h1>Planification PSI du rachis lombaire</h1>
  <p>L1 – L3 · guides de visée pédiculaire patient-spécifiques</p>
</header>
<div class="aide" id="aide">☝️ Un doigt : tourner · Deux doigts : zoomer</div>

<model-viewer id="mv" src="g1t1.glb" alt="Vertèbres L1 à L3 avec guides PSI et trajectoires de visée"
  camera-controls touch-action="none" auto-rotate auto-rotate-delay="2500" rotation-per-second="16deg"
  interaction-prompt="none" shadow-intensity="0.8" shadow-softness="1" exposure="1.1" tone-mapping="neutral"
  environment-image="neutral" camera-orbit="35deg 75deg auto"
  min-camera-orbit="auto 0deg auto" max-camera-orbit="auto 180deg auto"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor">
  <button slot="ar-button" style="display:none"></button>
</model-viewer>

<div class="bas">
  <div class="toggles">
    <button class="t on" id="bG"><i style="background:var(--bleu)"></i>Guides</button>
    <button class="t on" id="bT"><i style="background:var(--rouge)"></i>Trajectoires</button>
    <button class="t on" id="bO"><i style="background:#f0e6d0"></i>Os transparent</button>
  </div>
  <button id="ar">📱 Placer dans la pièce (réalité augmentée)</button>
  <div class="credit">Dr M. F. Djidi · Chirurgie orthopédique · EHS Ben Aknoun · Alger</div>
</div>

<script>
  const mv=document.getElementById('mv');
  const st={g:true,t:true,o:true};
  const fichier=()=>`g${+st.g}t${+st.t}.glb`;
  function osMat(){
    const m=mv.model&&mv.model.materials.find(x=>x.name==='os'); if(!m)return;
    if(st.o){m.setAlphaMode('BLEND');m.pbrMetallicRoughness.setBaseColorFactor([0.94,0.90,0.82,0.45]);}
    else{m.setAlphaMode('OPAQUE');m.pbrMetallicRoughness.setBaseColorFactor([0.94,0.90,0.82,1]);}
  }
  function bascule(btn,cle,recharge){
    btn.onclick=()=>{st[cle]=!st[cle];btn.classList.toggle('on',st[cle]);btn.classList.toggle('off',!st[cle]);
      if(recharge){const orbit=mv.getCameraOrbit().toString();mv.src=fichier();mv.addEventListener('load',()=>{mv.cameraOrbit=orbit;osMat()},{once:true});}
      else osMat();};
  }
  bascule(bG,'g',true);bascule(bT,'t',true);bascule(bO,'o',false);
  mv.addEventListener('load',()=>{osMat(); if(!mv.canActivateAR) ar.textContent='📱 Réalité augmentée non disponible sur ce téléphone';});
  ar.onclick=()=>{ if(mv.canActivateAR) mv.activateAR(); };
  mv.addEventListener('pointerdown',()=>{aide.style.opacity=0},{once:true});
</script>
</body>
</html>
